<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Schedule Management</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    @media print {
      body { background-color: white !important; padding: 0 !important; }
      .no-print { display: none !important; }
      .print-shadow-none { box-shadow: none !important; border: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-6">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header & Action Area -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4 print-shadow-none">
      <div class="flex items-center gap-4">
        <!-- Dynamic Calendar Icon -->
        <div class="w-14 h-14 rounded-xl bg-indigo-600 text-white flex flex-col items-center justify-center shadow-md overflow-hidden shrink-0">
          <span id="cal-month" class="bg-indigo-700 w-full text-center text-[10px] font-bold uppercase tracking-wider py-0.5">--</span>
          <span id="cal-day" class="text-xl font-extrabold leading-tight py-1">--</span>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-slate-900">Family Schedule</h1>
          <p id="status-text" class="text-xs text-slate-500 mt-0.5">Synced with GitHub Cloud</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-wrap items-center gap-2 no-print">
        <button onclick="loadLocalExcel()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg shadow-sm transition-colors text-xs flex items-center gap-1.5">
          🔄 Refresh Schedule
        </button>
        <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white font-medium px-4 py-2 rounded-lg shadow-sm transition-colors text-xs flex items-center gap-1.5">
          🖨️ Print Schedule
        </button>
      </div>
    </div>

    <!-- Filter Buttons & Tabs -->
    <div class="flex items-center gap-2 bg-white p-2 rounded-lg shadow-sm border border-slate-200 w-fit no-print">
      <button onclick="filterDays(10)" id="btn-10" class="px-3 py-1.5 text-xs font-medium rounded-md transition-colors text-slate-600 hover:bg-slate-100">Next 10 Days</button>
      <button onclick="filterDays(30)" id="btn-30" class="px-3 py-1.5 text-xs font-medium rounded-md transition-colors text-slate-600 hover:bg-slate-100">Next 30 Days</button>
      <button onclick="filterDays(90)" id="btn-90" class="px-3 py-1.5 text-xs font-medium rounded-md transition-colors bg-indigo-600 text-white">Next 90 Days</button>
      <button onclick="filterDays(0)" id="btn-all" class="px-3 py-1.5 text-xs font-medium rounded-md transition-colors text-slate-600 hover:bg-slate-100">All Semesters</button>
    </div>

    <!-- Schedule Table -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden print-shadow-none">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-100/70 border-b border-slate-200 text-slate-600 text-xs font-semibold uppercase tracking-wider">
              <th class="
